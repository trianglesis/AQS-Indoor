<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Station Main</title>
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function(event) { 
            // First call
            co2_stats();
            air_stats();
            battery_stats();
            // Continuous
            setInterval(function() {
                co2_stats();
            }, 1000 * 30);
            setInterval(function() {
                air_stats();
            }, 1000 * 30);
            setInterval(function() {
                battery_stats();
            }, 1000 * 60);
        })
    </script>
</head>
<body>
    <noscript>
        <div class="alert alert-warning" role="alert" style="margin: 10%;">
            <strong>We're sorry but web-demo doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
        </div>
    </noscript>
    <div class="alert alert-primary" role="alert" style="margin: 10px 20px 10px 20px;">SD Card hosted page.</div>
    <div style="margin-top: 10px;margin-bottom: 10px;margin-left: 5%;margin-right: 5%;">
        <table class="table table-sm table-striped table-hover">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Value</th>
                    <th scope="col">Units</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="4">Co2</td>
                </tr>
                <tr class="align-middle">
                    <td>1</td>
                    <td>CO2</td>
                    <td><span id="co2_stats" style="font-weight: bold;">0000</span></td>
                    <td>ppm</td>
                </tr>
                <tr>
                    <td colspan="4">Battery</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Battery voltage</td>
                    <td><span id="voltage_m" style="font-weight: bold;">0000</span></td>
                    <td>mV</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Battery Percent</td>
                    <td><span id="percentage" style="font-weight: bold;">0</span></td>
                    <td>%</td>
                </tr>
                <tr>
                    <td colspan="4">Air BME680</td>
                </tr>
                <tr>
                    <td>1</td>
                    <td>Temperature</td>
                    <td><span id="temperature" style="font-weight: bold;">0</span></td>
                    <td>C</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Humidity</td>
                    <td><span id="humidity" style="font-weight: bold;">0</span></td>
                    <td>%</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Pressure</td>
                    <td><span id="pressure" style="font-weight: bold;">0</span></td>
                    <td>hPa</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Air Quality</td>
                    <td><span id="air_q_index" style="font-weight: bold;">0</span></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
<script type="text/javascript">
    function co2_stats() {
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() { 
            if (xhttp.readyState == 4) {
                // console.log(`Response this.responseText: ${this.responseText}`);
                var jsonStr = JSON.parse(this.responseText);
                if (jsonStr) {
                    // console.log(`Response jsonStr: ${jsonStr}`);
                    document.getElementById("co2_stats").innerHTML = jsonStr[0]['co2_ppm'];
                }
            }
        }
        xhttp.open("GET", "http://192.168.1.197/api/v1/co2?limit=1", true);
        xhttp.send();
    }
</script>
<script type="text/javascript">
    function battery_stats() {
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() { 
            if (xhttp.readyState == 4) {
                var jsonStr = JSON.parse(this.responseText);
                if (jsonStr) {
                    document.getElementById("voltage_m").innerHTML = jsonStr[0]['voltage_m'];
                    document.getElementById("percentage").innerHTML = jsonStr[0]['percentage'];
                }
            }
        }
        xhttp.open("GET", "http://192.168.1.197/api/v1/battery?limit=1", true);
        xhttp.send();
    }
</script>
<script type="text/javascript">
    function air_stats() {
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() { 
            if (xhttp.readyState == 4) {
                var jsonStr = JSON.parse(this.responseText);
                if (jsonStr) {
                    document.getElementById("temperature").innerHTML = jsonStr[0]['temperature'];
                    document.getElementById("humidity").innerHTML = jsonStr[0]['humidity'];
                    document.getElementById("pressure").innerHTML = jsonStr[0]['pressure'];
                    document.getElementById("air_q_index").innerHTML = jsonStr[0]['air_q_index'];
                }
            }
        }
        xhttp.open("GET", "http://192.168.1.197/api/v1/air?limit=1", true);
        xhttp.send();
    }
</script>
</html>
